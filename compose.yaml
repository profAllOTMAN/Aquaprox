services:
  aquaprox:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_QR_URL: ${NEXT_PUBLIC_QR_URL:-https://www.aquaprox.com/}
        NEXT_PUBLIC_CONTACT_MODE: ${NEXT_PUBLIC_CONTACT_MODE:-demo}
        NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${NEXT_PUBLIC_ANALYTICS_ENDPOINT:-}
    image: aquaprox-experience:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      CONTACT_WEBHOOK_URL: ${CONTACT_WEBHOOK_URL:-}
      CONTACT_WEBHOOK_SECRET: ${CONTACT_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
